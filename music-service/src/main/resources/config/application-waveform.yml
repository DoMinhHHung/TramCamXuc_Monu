# ═══════════════════════════════════════════════════════════════════════════════
# WAVEFORM CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════════════

waveform:
  # ─── PNG Settings ─────────────────────────────────────────────────────────
  samples: 200
  png-width: 1024
  png-height: 128
  png-color: "34d399"                 # Tailwind green-400
  png-background-color: "ffffff"      # White
  png-center-line-color: "c8c8c8"     # Light gray

  # ─── SVG Settings ─────────────────────────────────────────────────────────
  svg-width: "100%"
  svg-height: 100
  svg-stroke-width: 1.5

  # ─── Caching ──────────────────────────────────────────────────────────────
  cache-enabled: true
  cache-ttl-seconds: 86400           
  cache-key-prefix: "waveform:"

  # ─── Processing ───────────────────────────────────────────────────────────
  async-processing: true              # Generate formats in background
  async-pool-size: 3                  # Thread pool size for async tasks
  max-file-size-mb: 100               # Maximum audio file size to process

  # ─── Formats ──────────────────────────────────────────────────────────────
  # Comma-separated list of formats to enable: png, svg, json
  enabled-formats: "png,svg,json"

# ═══════════════════════════════════════════════════════════════════════════════
# CACHING CONFIGURATION (Spring Cache + Redis)
# ═══════════════════════════════════════════════════════════════════════════════

spring:
  cache:
    type: redis
    redis:
      time-to-live: 86400000           # 24 hours in milliseconds
    cache-names:
      - waveformData
      - waveformRawData
      - songWaveformComplete

# ═══════════════════════════════════════════════════════════════════════════════
# ASYNC PROCESSING
# ═══════════════════════════════════════════════════════════════════════════════

spring.task.execution.pool.core-size: 5
spring.task.execution.pool.max-size: 10
spring.task.execution.pool.queue-capacity: 100
