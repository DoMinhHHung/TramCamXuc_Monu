appId: com.minhhung0403.monumobile
name: "09 - Quên mật khẩu"
tags:
  - auth
  - forgot-password
---
# Luồng quên mật khẩu: nhập email → nhận OTP → reset

- launchApp
- waitForAnimationToEnd

# Welcome → LoginOptions → Login → ForgotPassword
- tapOn: "Đăng nhập"
- waitForAnimationToEnd
- tapOn: "Đăng nhập với Email"
- waitForAnimationToEnd

- tapOn: "Quên mật khẩu?"
- waitForAnimationToEnd

# ForgotPasswordScreen
# (Nhập email để nhận OTP reset)
- tapOn:
    hint: "Nhập email của bạn"
- inputText: ${TEST_EMAIL}
- hideKeyboard

# Tìm và nhấn nút gửi
- scrollUntilVisible:
    element:
      text: "Gửi mã"
    direction: DOWN
    timeout: 3000
- tapOn: "Gửi mã"
- waitForAnimationToEnd

# Sang màn hình nhập OTP hoặc ResetPassword
# (Tùy app flow — assert màn hình tiếp theo)
- assertVisible: "Xác thực"

# --- Case email không tồn tại ---
- tapOn:
    accessibilityLabel: "Quay lại"
- waitForAnimationToEnd
- tapOn:
    hint: "Nhập email của bạn"
- clearText
- inputText: "khong_ton_tai_abc@mail.com"
- hideKeyboard
- tapOn: "Gửi mã"
- waitForAnimationToEnd
# Alert lỗi phải xuất hiện
- tapOn: "OK"
